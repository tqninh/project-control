steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'beta'
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/custom-llm-service:latest'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--cpu=8'
      - '--memory=32Gi'
      - '--gpu=1'
      - '--gpu-type=nvidia-l4'
      - '--no-gpu-zonal-redundancy'
      - '--port=8000'
      - '--no-cpu-throttling'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--timeout=3600'
      - '--set-env-vars=HF_TOKEN=${_HF_TOKEN}'
      - '--no-allow-unauthenticated'

substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'llm-repo'
  _SERVICE_NAME: 'local-llm-service'
  _HF_TOKEN: ''

options:
  machineType: 'E2_MEDIUM'
