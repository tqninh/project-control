steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'beta'
      - 'run'
      - 'deploy'
      - 'local-llm-service'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/llm-repo/custom-llm-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--cpu=8'
      - '--memory=32Gi'
      - '--gpu=1'
      - '--gpu-type=nvidia-l4'
      - '--no-gpu-zonal-redundancy'
      - '--port=8000'
      - '--no-cpu-throttling'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--timeout=3600'
      - '--set-env-vars=HF_TOKEN=${_HF_TOKEN}'
      - '--no-allow-unauthenticated'
substitutions:
  _HF_TOKEN: ''
options:
  machineType: 'E2_MEDIUM'
