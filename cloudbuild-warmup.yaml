steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SERVICE_URL=$(gcloud run services describe local-llm-service --region=us-central1 --format='value(status.url)')
        TOKEN=$(gcloud auth print-identity-token)
        curl -X POST "${SERVICE_URL}/v1/chat/completions" \
          -H "Authorization: Bearer ${TOKEN}" \
          -H "Content-Type: application/json" \
          -d '{"model": "Qwen/Qwen2.5-14B-Instruct-AWQ", "messages": [{"role": "user", "content": "ping"}], "max_tokens": 5}'
