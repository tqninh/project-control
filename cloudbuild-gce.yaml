steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        INSTANCE_NAME="${_INSTANCE_NAME}"
        ZONE="${_ZONE}"
        IMAGE_URI="us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/custom-llm-service:latest"

        echo "Kiểm tra xem VM $${INSTANCE_NAME} đã tồn tại chưa..."
        if gcloud compute instances describe "$${INSTANCE_NAME}" --zone="$${ZONE}" >/dev/null 2>&1; then
          echo "VM đã tồn tại. Đang tiến hành cập nhật Container Image trên VM..."
          # Trên COS chuẩn mới, ta cập nhật container bằng cách ssh hoặc restart lại lệnh docker run qua metadata/SSH
          gcloud compute instances ssh "$${INSTANCE_NAME}" --zone="$${ZONE}" --command="
            sudo docker stop llm-service || true
            sudo docker rm llm-service || true
            sudo docker pull $${IMAGE_URI}
            sudo docker run -d --restart=always --name=llm-service --gpus all -p 8000:8000 -e HF_TOKEN=${_HF_TOKEN} $${IMAGE_URI}
          "
        else
          echo "VM chưa tồn tại. Đang khởi tạo mới máy ảo kèm GPU L4 chuẩn cloud-init..."
          
          # Tạo nội dung cloud-init script để tự động kéo image và chạy Docker khi máy ảo khởi động lần đầu
          CLOUD_INIT_CONFIG="#cloud-config

          runcmd:
            - echo 'Đang khởi động Docker container cho vLLM...'
            - docker run -d --restart=always --name=llm-service --gpus all -p 8000:8000 -e HF_TOKEN=${_HF_TOKEN} $${IMAGE_URI}
          "

gcloud compute instances create "$${INSTANCE_NAME}" \
            --zone="$${ZONE}" \
            --machine-type=n1-standard-8 \
            --maintenance-policy=TERMINATE \
            --accelerator=type=nvidia-tesla-t4,count=1 \
            --boot-disk-size=100GB \
            --image-project=cos-cloud \
            --image-family=cos-stable \
            --metadata="user-data=$${CLOUD_INIT_CONFIG}" \
            --tags=allow-llm-api \
            --scopes=https://www.googleapis.com/auth/cloud-platform

substitutions:
  _INSTANCE_NAME: 'local-llm-vm'
  _ZONE: 'us-central1-a'
  _REPO_NAME: 'llm-repo'
  _HF_TOKEN: ''

options:
  machineType: 'E2_MEDIUM'
