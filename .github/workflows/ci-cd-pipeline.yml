name: LLM Infrastructure Pipeline

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Chọn tác vụ muốn thực hiện'
        required: true
        default: 'deploy_gce'
        type: choice
        options:
          - build_image       # 1. Đóng gói custom image và đẩy lên Artifact Registry
          - deploy_run        # 2. Triển khai lên Cloud Run (Dùng nếu có quota Cloud Run)
          - deploy_gce        # 3. Triển khai lên Google Compute Engine (GPU L4 VM)
          - warmup_run        # 4. Kích hoạt đánh thức hệ thống
          - cache_model_gcs   # 5. Tải Qwen GGUF lên GCS Bucket
          - deploy_native_vm  # 6. Copy model từ GCS và chạy VM CPU
      zone:
        description: 'Google Cloud Zone (Để trống sẽ dùng mặc định: us-central1-a)'
        required: false
        default: 'us-central1-a'
        type: string
      model_bucket:
        description: 'Tên GCS bucket chứa model (tên bucket phải duy nhất toàn cầu)'
        required: true
        default: 'lively-guard-512108-f4-llm-models'
        type: string

jobs:
  run-cloud-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Xác thực Google Cloud từ GitHub
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Thiết lập Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ==========================================================
      # HÀNH ĐỘNG 1: BUILD IMAGE
      # ==========================================================
      - name: Thực thi Cloud Build (Build Image)
        if: ${{ github.event.inputs.action_type == 'build_image' }}
        run: |
          gcloud builds submit --config cloudbuild-build.yaml .

      # ==========================================================
      # HÀNH ĐỘNG 2: DEPLOY CLOUD RUN
      # ==========================================================
      - name: Thực thi Cloud Build (Deploy Cloud Run)
        if: ${{ github.event.inputs.action_type == 'deploy_run' }}
        run: |
          gcloud builds submit --config cloudbuild-deploy.yaml \
            --substitutions=_HF_TOKEN=${{ secrets.HF_TOKEN }} .

      # ==========================================================
      # HÀNH ĐỘNG 3: DEPLOY COMPUTE ENGINE (GCE) - HỖ TRỢ NHẬP ZONE
      # ==========================================================
      - name: Thực thi Cloud Build (Deploy Compute Engine GPU)
        if: ${{ github.event.inputs.action_type == 'deploy_gce' }}
        run: |
          # Nếu người dùng để trống input zone, tự động fallback về us-central1-c
          TARGET_ZONE="${{ github.event.inputs.zone }}"
          if [ -z "$TARGET_ZONE" ]; then
            TARGET_ZONE="us-central1-c"
          fi
          
          echo "Đang triển khai GCE tại Zone: $TARGET_ZONE"
          gcloud builds submit --config cloudbuild-gce.yaml \
            --substitutions=_HF_TOKEN=${{ secrets.HF_TOKEN }},_ZONE="$TARGET_ZONE" .

      # ==========================================================
      # HÀNH ĐỘNG 4: WARM-UP HỆ THỐNG
      # ==========================================================
      - name: Thực thi Cloud Build (Warm-up)
        if: ${{ github.event.inputs.action_type == 'warmup_run' }}
        run: |
          gcloud builds submit --config cloudbuild-warmup.yaml .

      # ==========================================================
      # OPTION MỚI 1: TẢI MODEL TỪ HUGGING FACE LÊN GCS
      # ==========================================================
      - name: Cache Qwen GGUF model to GCS
        if: ${{ github.event.inputs.action_type == 'cache_model_gcs' }}
        env:
          MODEL_BUCKET: ${{ github.event.inputs.model_bucket }}
        run: |
          set -euo pipefail
          if [ -z "$MODEL_BUCKET" ]; then
            echo "model_bucket không được để trống."
            exit 1
          fi
          gcloud builds submit \
            --config cloudbuild-model-bucket.yaml \
            --substitutions=_MODEL_BUCKET="$MODEL_BUCKET" .

      # ==========================================================
      # OPTION MỚI 2: TẠO/CẬP NHẬT VM, COPY MODEL TỪ GCS VÀ START SERVICE
      # ==========================================================
      - name: Deploy native CPU VM from GCS model
        if: ${{ github.event.inputs.action_type == 'deploy_native_vm' }}
        env:
          TARGET_ZONE: ${{ github.event.inputs.zone }}
          MODEL_BUCKET: ${{ github.event.inputs.model_bucket }}
        run: |
          set -euo pipefail
          if [ -z "$TARGET_ZONE" ]; then
            TARGET_ZONE="us-central1-a"
          fi
          if [ -z "$MODEL_BUCKET" ]; then
            echo "model_bucket không được để trống."
            exit 1
          fi
          gcloud builds submit \
            --config cloudbuild-model-vm.yaml \
            --substitutions=_ZONE="$TARGET_ZONE",_MODEL_BUCKET="$MODEL_BUCKET" .
