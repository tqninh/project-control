name: Deploy vLLM to Google Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# BẮT BUỘC: Cấp quyền cho GitHub Actions sinh token tạm thời để nói chuyện với GCP
permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Đăng nhập an toàn vào GCP bằng Workload Identity Federation (Không cần file JSON)
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/891363773518/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-cloudrun-deployer@project-cc1e0155-70ab-4158-bcd.iam.gserviceaccount.com'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy to Cloud Run with GPU and GCS Bucket
      run: |
        gcloud run deploy vllm-qwen-server \
          --image=vllm/vllm-openai:v0.8.2 \
          --region=us-central1 \
          --cpu=4 \
          --memory=16Gi \
          --gpu=1 \
          --gpu-type=nvidia-l4 \
          --port=8080 \
          --min-instances=0 \
          --max-instances=1 \
          --set-env-vars=HF_HUB_OFFLINE=1 \
          --args="--model=/model-cache/Qwen2.5-14B-Instruct-AWQ","--quantization=awq","--port=8080","--max-model-len=4096","--gpu-memory-utilization=0.90" \
          --add-volume=name=model-volume,type=cloud-storage,bucket=my-llm-model-bucket \
          --add-volume-mount=volume=model-volume,mount-path=/model-cache \
          --allow-unauthenticated
