name: Deploy vLLM to Google Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# BẮT BUỘC: Cấp quyền cho GitHub Actions sinh token tạm thời để nói chuyện với GCP
permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Đăng nhập an toàn vào GCP bằng Workload Identity Federation (Không cần file JSON)
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/891363773518/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-cloudrun-deployer@project-cc1e0155-70ab-4158-bcd.iam.gserviceaccount.com'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy to Cloud Run via Compose
      run: |
        gcloud run compose up \
          --file=compose.yaml \
          --region=us-central1 \
          --gpu=1 \
          --gpu-type=nvidia-l4 \
          --add-volume=name=model-volume,type=cloud-storage,bucket=my-llm-model-bucket,mount-path=/model-cache \
          --cpu=4 \
          --memory=16Gi \
          --min-instances=0 \
          --max-instances=1
